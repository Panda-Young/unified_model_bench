name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # windows-latest: full build of the default-enabled backends (ONNX + NCNN)
  # and run the doctest unit-test suite via ctest.
  # The vendored prebuilt libs in deps/ are Windows (win-x64/win-x86) and
  # Android (android/arm64-v8a) only, so Windows is the primary verification
  # target. TFLITE/MNN/LITERT/QNN are OFF by default and left OFF here to keep
  # CI from needing libs that are not shipped for the CI image.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build `
          -DBUILD_TESTING=ON `
          -DHAVE_ONNX_BACKEND=ON `
          -DHAVE_NCNN_BACKEND=ON `
          -DHAVE_TFLITE_BACKEND=OFF `
          -DHAVE_MNN_BACKEND=OFF `
          -DHAVE_LITERT_BACKEND=OFF `
          -DHAVE_QNN_SDK_BACKEND=OFF
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release
        shell: pwsh

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
        shell: pwsh

      # Style gate: no unbraced if/else/for/while/do/switch/case bodies.
      # The script exits 0 only when it actually scanned files and found no
      # violations, so a broken/empty scan fails the job instead of passing.
      - name: Brace style check
        run: python tools/utils/check_braces.py
        shell: pwsh

      # Batch-file gate: no unescaped parens in echo lines inside a ( )
      # block. Such a paren is parsed as block syntax and kills the whole
      # script at PARSE time with "... was unexpected at this time." - even
      # when the offending branch is never taken.
      - name: Batch paren check
        run: python tools/utils/check_bat_parens.py
        shell: pwsh

  # ---------------------------------------------------------------------------
  # ubuntu-latest: source-compilability smoke test. The vendored Linux desktop
  # prebuilt libraries (deps/onnxruntime/lib/linux-x64, deps/ncnn/lib/linux-x64)
  # exist in the working tree but are excluded from git (.gitignore -> deps/),
  # so the CI image does not have them. Every HAVE_*_BACKEND is therefore kept
  # OFF here: this still compiles the pure-logic modules and the doctest suite
  # (csv_utils / scheduler / cmd_args / model_loader / input_provider /
  # result_collector / platform), guarding against Linux-only breakage such as
  # the glibc clock_gettime/CLOCK_MONOTONIC issue. Real ONNX+NCNN inference on
  # Linux is verified locally where the vendored libs are present.
  # ---------------------------------------------------------------------------
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -S . -B build \
            -DBUILD_TESTING=ON \
            -DHAVE_ONNX_BACKEND=OFF \
            -DHAVE_TFLITE_BACKEND=OFF \
            -DHAVE_NCNN_BACKEND=OFF \
            -DHAVE_MNN_BACKEND=OFF \
            -DHAVE_LITERT_BACKEND=OFF \
            -DHAVE_QNN_SDK_BACKEND=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
